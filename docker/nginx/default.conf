# Hardened config for a small, static, low-traffic (<50 concurrent users)
# marketing site. Priorities: fast responses, small attack surface.
#
# This file is spliced into the `http {}` block of the base image's
# nginx.conf, so http-level directives (gzip, limit_req_zone, ...) are
# allowed here alongside the server blocks.

# Don't leak the nginx version in the Server header / error pages.
server_tokens off;

# Static site: no uploads, no large request bodies expected.
client_max_body_size 1m;
client_body_timeout   10s;
client_header_timeout 10s;
send_timeout           10s;
# keepalive_timeout is already set (65s) in the base image's nginx.conf;
# nginx errors on a duplicate directive in the same (http) context, so it
# isn't repeated here.

# Compression for the JS/CSS bundle (images, video and woff2 fonts are
# already compressed formats, so they're left out of gzip_types on purpose).
# gzip_static sirve archivos .gz si existen junto al original; si no, se
# comprime en cada respuesta con `gzip on`.
gzip_static on;
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css application/javascript application/json
           image/svg+xml application/manifest+json;

# Rate limiting: generous enough for a real visitor loading a page full of
# assets, tight enough to blunt scripted abuse/scanning against a small
# single-instance deployment. Tune `rate`/`burst` if real traffic needs it.
limit_req_zone  $binary_remote_addr zone=req_zone:10m rate=100r/s;
# The contact form sends email, so it gets a much tighter limit per IP:
# ~5 messages a minute, a small burst, then 429 (see location = /api/contact).
limit_req_zone  $binary_remote_addr zone=contact_zone:1m rate=5r/m;
# The form fetches a new "largest number" challenge on load and after a wrong
# answer, so that endpoint gets a looser (but still small) limit.
limit_req_zone  $binary_remote_addr zone=challenge_zone:1m rate=20r/m;
# News is read-only and cached for 5 minutes, but each "Cargar más" or filter
# change is a request, so it gets its own moderate limit.
limit_req_zone  $binary_remote_addr zone=news_zone:1m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

# ---------------------------------------------------------------------------
# Plain HTTP: only used for the health check and to redirect everything else
# to HTTPS. TLS is terminated here with certificates you supply (mounted
# read-only at /etc/nginx/certs — see certs/README.md).
# ---------------------------------------------------------------------------
server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # Optional stronger DH group for legacy ciphers — uncomment if you
    # generate one (openssl dhparam -out certs/dhparam.pem 2048) and mount it.
    # ssl_dhparam /etc/nginx/certs/dhparam.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    limit_req  zone=req_zone burst=40 nodelay;
    limit_conn conn_zone 100;

    root  /usr/share/nginx/html;
    index index.html;

    # Directory redirects (/es -> /es/) must stay on the public host/port;
    # an absolute one would point at the container's internal :8443.
    absolute_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Contact form -> the `api` service (api/server.mjs). Resolved at request
    # time through Docker's DNS, so nginx still starts if the api is down
    # (the form then gets a 502 and shows its error message).
    location = /api/contact {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        limit_req zone=contact_zone burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $contact_api http://api:3000;
        proxy_pass $contact_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api/challenge {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        limit_req zone=challenge_zone burst=10 nodelay;
        limit_req_status 429;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $contact_api http://api:3000;
        proxy_pass $contact_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Performing-arts news -> the `news` service (news/server.mjs). Read-only:
    # only GET and HEAD reach it. Its /status endpoint is deliberately not routed.
    location = /api/news {
        include /etc/nginx/security-headers.conf;
        limit_req zone=news_zone burst=20 nodelay;
        limit_req_status 429;
        limit_except GET { deny all; }

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $news_api http://news:3000;
        proxy_pass $news_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Never serve dotfiles or common config/VCS paths.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Hashed, immutable build assets: cache forever.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html se revalida siempre, así cada deploy se ve enseguida.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # TRAMA es una SPA con rutas del lado del cliente (/salas/..., /mi-cuenta/...):
    # lo que no es un archivo real se responde con index.html y React Router
    # decide (incluida la página 404 de la app).
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
