# Security headers, factored into one snippet and `include`d in every
# location block that serves content.
#
# Why not just set these once in the `server {}` block? nginx's add_header
# has a sharp edge: a location that defines ANY add_header of its own does
# NOT inherit add_header directives from its parent (server or http)
# context — the parent's headers are silently dropped for that location,
# not merged. Since /assets/ and = /index.html each need their own
# Cache-Control, putting the headers here and including this file
# everywhere avoids relying on inheritance at all.
add_header Strict-Transport-Security "max-age=3600; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# TRAMA: scripts y fuentes propios (fuentes vía @fontsource, empaquetadas).
# Imágenes y video pueden venir de URLs https que cargan los usuarios
# (avatar, portadas, video promocional).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'" always;
